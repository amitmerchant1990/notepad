<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Blog | Notepad.js.org</title>

    <meta name="description"
        content="Thoughts, ideas and articles about simple note-taking, writing, productivity and the web.">

    <link rel="canonical" href="https://notepad.js.org/blog/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Blog | Notepad.js.org">
    <meta property="og:description"
        content="Thoughts, ideas and articles about simple note-taking, writing, productivity and the web.">
    <meta property="og:url" content="https://notepad.js.org/blog/">
    <meta property="og:site_name" content="Notepad.js.org">

    <link rel="stylesheet" href="/blog/assets/blog.css">
</head>

<body>

    <header class="site-header">
        <a href="/">Notepad.js.org</a>
    </header>

    <main class="blog-index">

        <header class="index-header">
            <p class="eyebrow">Notepad.js.org</p>

            <h1>Blog</h1>

            <p>
                Thoughts on simple note-taking, writing, productivity,
                and building things for the web.
            </p>
        </header>

        <section class="post-list">

            {{posts}}

        </section>

        <footer class="article-footer">
            <a href="/">← Back to Notepad.js.org</a>
        </footer>

    </main>

</body>

</html>
